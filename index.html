<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>M-D</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: #fff;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  overflow-x: hidden;
  overflow-y: hidden;
}

/* =========================
   NEW MAIN HEADER
========================= */

.topbar {
  width: 100%;
  height: 50px !important;

  background: #8798ee !important;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 0 18px !important;

  position: relative;
}
.notification-bell {
  position: absolute;

  right: 55px;
  top: 14px;

  width: 18px;
  height: 19px;

  border: 2.5px solid #000;
  border-bottom: none;

  border-radius: 10px 10px 3px 3px;
}

.notification-bell::before {
  content: "";

  position: absolute;

  left: -5px;
  bottom: -3px;

  width: 24px;
  height: 2.5px;

  background: #000;

  border-radius: 3px;
}

.notification-bell::after {
  content: "";

  position: absolute;

  left: 6px;
  bottom: -7px;

  width: 5px;
  height: 5px;

  background: #000;

  border-radius: 50%;
}


.title {
  color: #fff !important;
  font-size: 20px !important;
  font-weight: 400 !important;
  line-height: 1;
}

.title .new {
  display: none;
}

/* M-D header text */
.title::before {
  content: "M-D( 2 )";
  font-size: 20px;
  font-weight: 400;
}

/* Hide original title text */
.title {
  font-size: 0 !important;
}


/* =========================
   NOTIFICATION ICON
========================= */

.bell-button {
  position: absolute;
  right: 18px;
  top: 10px;

  width: 30px;
  height: 30px;

  padding: 0;
  margin: 0;

  border: none;
  background: transparent;

  display: flex;
  align-items: center;
  justify-content: center;
}

.bell-button svg {
  width: 30px;
  height: 30px;
}


/* =========================
   MAIN CONTAINER
========================= */

.container {
  width: 100%;
  max-width: 550px;

  margin: 0 auto;

  padding:
    90px
    14px
    30px !important;
}


/* =========================
   HIDE ORIGINAL MAIN NUMBER
   JS ELEMENTS ARE KEPT
========================= */

.container > .hero {
  display: block !important;
  width: 100%;
  text-align: center;
}

/* =========================
   SET + MAIN NUMBER + VALUE
   SCREENSHOT STYLE
========================= */

.market-line {
  width: 100%;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 0 14px !important;

  margin-top: -75px !important;

  gap: 8px;
}


/* =========================
   SET / VALUE
========================= */

.market-item {
  flex: 1;

  background: transparent !important;
  border: none !important;

  padding: 0 !important;
  margin: 0 !important;

  box-shadow: none !important;
}

.market-item:first-child {
  text-align: left;
}

.market-item:last-child {
  text-align: right;
}

.market-item span {
  display: block;

  color: #111 !important;

  font-size: 21px !important;
  font-weight: 700 !important;

  line-height: 1;

  margin-bottom: 18px !important;
}

.market-item strong {
  display: block;

  color: #8798ee !important;

  font-size: 18px !important;
  font-weight: 400 !important;

  line-height: 1;
}


/* =========================
   MAIN NUMBER
========================= */

.number {
  flex: 0 0 auto;

  display: block !important;

  color: #111 !important;

  font-size: 115px !important;
  font-weight: 800 !important;

  line-height: .85;

  margin: 15px 0 -25px !important;

  padding: 0 !important;

  text-align: center;
}


/* =========================
   UPDATED
========================= */

.updated {
  display: block !important;

  color: #777 !important;

  font-size: 16px !important;
  font-weight: 400 !important;

  line-height: 1.2;

  margin-top: 42px !important;
margin-bottom: 25px !important;
  text-align: center;
}

.sunday-dubai-3d {
  display: none;
}

/* =========================
   2D TIME CARDS
========================= */

.container > .time-grid {
  width: 100%;

  display: grid;

  grid-template-columns:
    repeat(2, minmax(0, 1fr));

  gap: 10px 8px;

  margin: 0 !important;
}

.container > .time-grid .time-card {
  width: 100%;
  height: 80px !important;

  padding: 0 !important;

  border: none !important;
  border-radius: 14px !important;

  background: #fff !important;

  color: #101820 !important;

  box-shadow:
    0 2px 7px rgba(0,0,0,.16),
    0 1px 2px rgba(0,0,0,.08);

  overflow: hidden;
}

.container > .time-grid .time-card strong {
  width: 100%;
  height: 48% !important;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 0 !important;

  color: #101820 !important;

  font-size: 20px !important;
  font-weight: 700;

  line-height: 1;

  border-bottom: 1px solid #eeeeee !important;
}

.container > .time-grid .result {
  width: 100%;
  height: 52% !important;

  display: flex;
  align-items: center;
  justify-content: center;

  color: #8798ee !important;

  font-size: 24px !important;
  font-weight: 800;

  line-height: 1;
}


/* =========================
   BOTTOM BUTTONS
========================= */

.menu-grid {
  width: 100%;

  display: grid;

  grid-template-columns:
    repeat(2, minmax(0, 1fr));

  gap: 6px 8px;

  margin-top: 18px !important;

  padding: 0 !important;
}

.menu-grid button {
  width: 100%;

  height: 55px !important;
  min-height: 55px !important;

  padding: 3px !important;

  border: 1px solid #dfe3f5 !important;

  border-radius: 6px !important;

  background: #fff !important;

  color: #8798ee !important;

  font-family: Arial, Helvetica, sans-serif;

  font-size: 12px !important;
  font-weight: 400 !important;

  white-space: nowrap;

  box-shadow: none !important;
}

.menu-grid button:active {
  transform: translateY(1px);
}


/* =========================
   HISTORY PAGES
========================= */

.history-page {
  display: none;

  width: 100%;
  min-height: 100vh;

  background: #f1f1f1;
}

.history-header {
  width: 100%;
  height: 55px !important;

  background: #3f719c;

  display: flex;
  align-items: center;
  justify-content: flex-start;

  padding: 0 !important;

  color: #fff;
}

.back-btn {
  width: 60px !important;
  height: 55px !important;

  border: none;
  background: transparent;

  padding: 0 !important;
  margin: 0 !important;

  position: relative;

  font-size: 0;
}

.back-btn::before {
  content: "";

  width: 14px;
  height: 14px;

  border-left: 2.5px solid #fff;
  border-bottom: 2.5px solid #fff;

  transform: rotate(45deg);

  position: absolute;

  left: 22px;
  top: 20px;
}

.back-btn::after {
  content: "";

  width: 22px;
  height: 2.5px;

  background: #fff;

  position: absolute;

  left: 22px;
  top: 27px;

  border-radius: 2px;
}

.history-title {
  font-size: 25px !important;
  font-weight: 700;

  margin: -4px 0 0 0 !important;

  line-height: 1;
}

.history-list {
  width: 100%;

  padding:
    13px
    13px
    30px;
}

.history-card {
  width: 100%;
  height: 100px !important;

  margin:
    0
    0
    14px
    0 !important;

  padding:
    10px
    16px !important;

  background: #fff;

  border-radius: 12px;

  box-shadow:
    0 2px 5px rgba(0,0,0,.15);

  color: #3f6687;
}

.history-top {
  display: flex;

  justify-content: space-between;
  align-items: center;

  height: 27px;

  font-size: 18px;
  font-weight: 600;
}

.history-bottom {
  display: flex;

  justify-content: space-between;
  align-items: center;

  height: 45px;

  margin-top: 12px;

  font-size: 21px;
  font-weight: 600;
}

.history-bottom strong {
  font-size: 24px;
}


/* =========================
   2D HISTORY
========================= */

#twoDResults {
  position: fixed !important;

  top: 0;
  left: 0;
  right: 0;
  bottom: 0;

  width: 100%;
  height: 100%;

  overflow-y: auto !important;
  overflow-x: hidden !important;

  -webkit-overflow-scrolling: touch;
}

.twoD-date {
  width: fit-content;

  margin: 25px auto 30px;

  padding: 6px 16px;

  background: #3f719c;

  color: #fff;

  border-radius: 30px;

  font-size: 18px;
  font-weight: 700;

  text-align: center;
}

/* =========================
   2D HISTORY
   SCREENSHOT STYLE
========================= */

#twoDResults {
  position: fixed !important;

  top: 0;
  left: 0;
  right: 0;
  bottom: 0;

  width: 100%;
  height: 100%;

  background: #fff !important;

  overflow-y: auto !important;
  overflow-x: hidden !important;

  -webkit-overflow-scrolling: touch;
}


/* =========================
   HISTORY HEADER
========================= */

#twoDResults .history-header {
  height: 60px !important;

  background: #8798ee !important;

  display: flex;
  align-items: center;

  padding: 0 !important;

  box-shadow:
    0 2px 6px rgba(0,0,0,.15);
}

#twoDResults .back-btn {
  width: 65px !important;
  height: 94px !important;
}

#twoDResults .back-btn::before {
  width: 17px;
  height: 17px;

  left: 25px;
  top: 36px;

  border-left: 2.5px solid #fff;
  border-bottom: 2.5px solid #fff;
}

#twoDResults .back-btn::after {
  width: 27px;
  height: 2.5px;

  left: 25px;
  top: 44px;

  background: #fff;
}

#twoDResults .history-title {
  font-size: 22px !important;
  font-weight: 700 !important;

  color: #fff !important;

  margin: -2px 0 0 0 !important;
}


/* =========================
   VERSION
========================= */

#twoDResults .history-header::after {
  content: "";

  margin-left: auto;

  margin-right: 20px;

  color: #fff;

  font-size: 18px;

  font-weight: 400;
}


/* =========================
   HISTORY LIST
========================= */

#twoDResults .history-list {
  width: 100%;

  padding:
    25px
    16px
    40px !important;
}


/* =========================
   DATE
========================= */

#twoDResults .twoD-date {
  width: fit-content;

  margin:
    0 auto 8px !important;

  padding:
    12px 30px !important;

  background: #8798ee !important;

  color: #fff !important;

  border-radius: 13px !important;

  font-size: 14px !important;
  font-weight: 400 !important;

  line-height: 1.2;

  text-align: center;
}


/* =========================
   TIME GRID
   ONE COLUMN
========================= */

#twoDResults .time-grid {
  width: 100%;

  display: grid;

  grid-template-columns: 1fr !important;

  gap: 7px !important;

  padding: 0 !important;

  margin:
    0 0 150px !important;
}


/* =========================
   TIME CARD
========================= */

#twoDResults .time-card {
  width: 100%;

  height: 54px !important;

  display: flex !important;

  align-items: center;
  justify-content: space-between;

  padding:
    0 25px !important;

  border: none !important;

  border-radius: 13px !important;

  background: #fff !important;

  box-shadow:
    0 2px 8px rgba(0,0,0,.18) !important;

  color: #111 !important;
}


/* =========================
   TIME
========================= */

#twoDResults .time-card strong {
  width: auto !important;
  height: auto !important;

  display: block !important;

  padding: 0 !important;

  border: none !important;

  color: #111 !important;

  font-size: 18px !important;

  font-weight: 400 !important;

  line-height: 1;
}


/* =========================
   RESULT
========================= */

#twoDResults .time-card .result {
  width: auto !important;
  height: auto !important;

  display: block !important;

  color: #8798ee !important;

  font-size: 24px !important;

  font-weight: 400 !important;

  line-height: 1;

  margin: 0 !important;
}


/* =========================
   SMALL PHONES
========================= */

@media (max-width: 360px) {

  #twoDResults .history-header {
    height: 82px !important;
  }

  #twoDResults .back-btn {
    height: 82px !important;
  }

  #twoDResults .history-title {
    font-size: 27px !important;
  }

  #twoDResults .history-header::after {
    font-size: 16px;
    margin-right: 14px;
  }

  #twoDResults .history-list {
    padding:
      22px
      12px
      30px !important;
  }

  #twoDResults .twoD-date {
    font-size: 14px !important;
    padding: 6px 18px !important;
  }

  #twoDResults .time-card {
    height: 68px !important;
    padding: 0 20px !important;
  }

  #twoDResults .time-card strong {
    font-size: 22px !important;
  }

  #twoDResults .time-card .result {
    font-size: 35px !important;
  }
}

/* =========================
   DUBAI 3D HISTORY
========================= */

#dubaiHistory {
  position: fixed !important;

  top: 0;
  left: 0;
  right: 0;
  bottom: 0;

  width: 100%;
  height: 100%;

  overflow-y: auto !important;
  overflow-x: hidden !important;

  -webkit-overflow-scrolling: touch;
}

#dubaiHistory .history-card {
  height: 100px !important;

  margin-bottom: 14px !important;

  padding:
    10px
    16px !important;

  border-radius: 12px;
}


/* =========================
   THAI 3D HISTORY
========================= */

#thai3DHistory {
  position: fixed !important;

  top: 0;
  left: 0;
  right: 0;
  bottom: 0;

  width: 100%;
  height: 100%;

  overflow-y: auto !important;
  overflow-x: hidden !important;

  background: #f1f1f1;
}

#thai3DHistory .history-card {
  height: 82px !important;
  margin-bottom: 10px !important;
  padding: 8px 14px !important;

  background: #f8f7ff !important;
  border: 1px solid #ddd6ff !important;
  border-radius: 10px !important;

  box-shadow: 0 2px 6px rgba(120, 90, 200, 0.10) !important;
  color: #333 !important;
}

#thai3DHistory .history-top {
  height: 22px !important;
  font-size: 15px !important;
  font-weight: 500 !important;
  color: #8798ee !important;
}

#thai3DHistory .history-bottom {
  height: 36px !important;
  margin-top: 5px !important;
  font-size: 17px !important;
  font-weight: 500 !important;
  color: #8798ee !important;
}

#thai3DHistory .history-bottom strong {
  font-size: 17px !important;
  font-weight: 700 !important;
  color: #8798ee !important;
}
/* =========================
   HOLIDAYS
========================= */

#holidaysPage {
  position: fixed !important;

  top: 0;
  left: 0;
  right: 0;
  bottom: 0;

  width: 100%;
  height: 100%;

  background: #f1f1f1;

  overflow-y: auto !important;
  overflow-x: hidden !important;

  -webkit-overflow-scrolling: touch;
}
#dubaiHistory .history-header,
#thai3DHistory .history-header,
#holidaysPage .history-header {
  height: 60px !important;
  background: #8798ee !important;
}
.holiday-list {
  width: 100%;

  padding:
    13px
    13px
    30px;
}

.holiday-card {
  width: 100%;
  min-height: 80px;

  margin-bottom: 14px;

  padding:
    0
    17px;

  background: #fff;

  border-radius: 12px;

  box-shadow:
    0 2px 5px rgba(0,0,0,.15);

  color: #8798ee;

  display: flex;

  align-items: center;
  justify-content: space-between;

  gap: 12px;
}

.holiday-date,
.holiday-name {
  font-size: 17px;
  font-weight: 600;
}

.holiday-name {
  text-align: right;
}


/* =========================
   RANDOM ANIMATION
========================= */

.number.random-fade-out {
  animation: randomFadeOut .5s ease forwards;
}

.number.random-fade-in {
  animation: randomFadeIn .5s ease forwards;
}

@keyframes randomFadeOut {
  from { opacity: 1; }
  to   { opacity: 0; }
}

@keyframes randomFadeIn {
  from { opacity: 0; }
  to   { opacity: 1; }
}

.number.pre-result-loop {
  animation: preResultLoop 5s ease-in-out infinite;
}

@keyframes preResultLoop {
  0%   { opacity: 1; }
  40%  { opacity: 1; }
  50%  { opacity: 0; }
  60%  { opacity: 1; }
  80%  { opacity: 1; }
  90%  { opacity: 0; }
  100% { opacity: 1; }
}


/* =========================
   SMALL PHONES
========================= */

@media (max-width: 360px) {

  .topbar {
    height: 46px !important;
    padding: 0 14px !important;
  }

  .title::before {
    font-size: 18px;
  }

  .container {
    padding:
      80px
      11px
      25px !important;
  }

  .container > .time-grid {
    gap: 8px 6px;
  }

  .container > .time-grid .time-card {
    height: 72px !important;
    border-radius: 12px !important;
  }

  .container > .time-grid .time-card strong {
    font-size: 18px !important;
  }

  .container > .time-grid .result {
    font-size: 21px !important;
  }

  .menu-grid {
    gap: 5px 6px;
    margin-top: 15px !important;
  }

  .menu-grid button {
    height: 50px !important;
    min-height: 50px !important;
    font-size: 11px !important;
  }
}


/* =========================
   LARGE PHONES
========================= */

@media (min-width: 600px) {

  .container {
    padding-top: 90px;
  }
}

#dubaiHistory .history-card {
  height: 82px !important;
  margin-bottom: 10px !important;
  padding: 8px 14px !important;

  background: #f8f7ff !important;
  border: 1px solid #ddd6ff !important;
  border-radius: 10px !important;

  box-shadow: 0 2px 6px rgba(120, 90, 200, 0.10) !important;
  color: #333 !important;
}

#dubaiHistory .history-top {
  height: 22px !important;
  font-size: 15px !important;
  font-weight: 500 !important;
  color: #8798ee !important;
}

#dubaiHistory .history-bottom {
  height: 36px !important;
  margin-top: 5px !important;
  font-size: 17px !important;
  font-weight: 500 !important;
  color: #8798ee !important;
}

#dubaiHistory .history-bottom strong {
  font-size: 17px !important;
  font-weight: 700 !important;
  color: #8798ee !important;
}
</style>
</head>

<body>
<!-- =========================
     HEADER
     ========================= -->
<header class="topbar">

  <div class="title">
    M-D
  </div>

  <button class="bell-button" onclick="toggleMute()">
    <svg id="bellIcon"
         viewBox="0 0 24 24"
         width="30"
         height="30"
         fill="none"
         stroke="#000"
         stroke-width="2"
         stroke-linecap="round"
         stroke-linejoin="round">

      <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path>
      <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>

    </svg>
  </button>

</header>

<main class="container">

  <!--
    ဒီ Hero ကို မဖျက်ပါနဲ့။
    JS က #number / #updated / #sundayDubai3D
    ကို အသုံးပြုနေတဲ့အတွက် DOM ထဲမှာထားပြီး CSS နဲ့ပဲ ဖျောက်ထားတာပါ။
  -->

<section class="hero">

  <div class="market-line">

  <div class="market-item">
    <span>SET</span>
    <strong id="setValue">--</strong>
  </div>

  <div id="number" class="number">
    --
  </div>

  <div class="market-item">
    <span>VALUE</span>
    <strong id="valueValue">--</strong>
  </div>

</div>

  <div id="updated" class="updated">
    Update : 2026-09-08 08:43:54 AM
  </div>

  <div
    id="sundayDubai3D"
    class="sunday-dubai-3d">

    <div class="sunday-dubai-title">
      Dubai 3D
    </div>

    <div id="sundayDubaiResult">
      ***
    </div>

  </div>

</section>


  <!-- =========================
       MAIN 2D CARDS
  ========================= -->

  <section class="time-grid">

    <button
      class="time-card"
      data-time="11:00 AM">

      <strong>11:00 AM</strong>

      <div class="result"></div>

    </button>


    <button
      class="time-card"
      data-time="1:00 PM">

      <strong>1:00 PM</strong>

      <div class="result"></div>

    </button>


    <button
      class="time-card"
      data-time="3:00 PM">

      <strong>3:00 PM</strong>

      <div class="result"></div>

    </button>


    <button
      class="time-card"
      data-time="5:00 PM">

      <strong>5:00 PM</strong>

      <div class="result"></div>

    </button>


    <button
      class="time-card"
      data-time="7:00 PM">

      <strong>7:00 PM</strong>

      <div class="result"></div>

    </button>


    <button
      class="time-card"
      data-time="9:00 PM">

      <strong>9:00 PM</strong>

      <div class="result"></div>

    </button>

  </section>


  <!-- =========================
       BOTTOM MENU
  ========================= -->

  <section class="menu-grid">

    <button onclick="openThai3DHistory()">
      Thai 3D Results
    </button>

    <button onclick="open2DResults()">
      2D Results
    </button>

    <button onclick="openDubaiHistory()">
      Dubai 3D
    </button>

    <button onclick="openHolidays()">
      ပိတ်ရက်များ
    </button>

  </section>

</main>

<!-- =========================
     DUBAI 3D HISTORY
========================= -->

<section id="dubaiHistory" class="history-page">

  <header class="history-header">

    <button
      class="back-btn"

<script>
  /* =========================
     JAVASCRIPT
  ========================= */


const numberElement =
  document.getElementById("number");


function getDrawResult(drawName) {
  if (is2DClosedDay() || isHoliday2D()) {
    return "";
  }
  if (!window.firebaseResults) {
    return "?";
  }

  const now = new Date(syncedNow());

  const pad = n =>
    String(n).padStart(2, "0");

  const today =
    `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;

  const firebaseKey =
    drawName.replace(" ", "");

  /* =========================
     DATE BASED RESULT
  ========================= */

  if (
    window.firebaseResults[today] &&
    window.firebaseResults[today][firebaseKey] !== undefined
  ) {

    return String(
      window.firebaseResults[today][firebaseKey]
    ).padStart(2, "0");

  }

  /* =========================
     OLD FORMAT SUPPORT
  ========================= */

  if (
    window.firebaseResults[drawName] !== undefined
  ) {

    return String(
      window.firebaseResults[drawName]
    ).padStart(2, "0");

  }

  if (
    window.firebaseResults[firebaseKey] !== undefined
  ) {

    return String(
      window.firebaseResults[firebaseKey]
    ).padStart(2, "0");

  }

  return "?";
}


/* =========================
   SYNCED RANDOM NUMBER
========================= */


function randomNumber(seed) {

  let hash = 0;

  for (let i = 0; i < seed.length; i++) {
    hash =
      ((hash << 5) - hash) +
      seed.charCodeAt(i);

    hash |= 0;
  }

  hash = Math.abs(hash);

  return String(
    hash % 100
  ).padStart(2, "0");
}
const drawTimes = [
  { name: "11:00 AM", seconds: 11 * 3600 },
  { name: "1:00 PM", seconds: 13 * 3600 },
  { name: "3:00 PM", seconds: 15 * 3600 },
  { name: "5:00 PM", seconds: 17 * 3600 },
  { name: "7:00 PM", seconds: 19 * 3600 },
  { name: "9:00 PM", seconds: 21 * 3600 }
];
// ===== TEST MODE =====
const TEST_MODE = false;

// လက်ရှိအချိန်ကနေ ဘယ်နှစ်စက္ကန့်နောက်မှာ Draw ဖြစ်မလဲ
const TEST_DRAW_AFTER_SECONDS = 60;
let testDrawStartTime = Date.now();
/* =========================
   RESULT SYSTEM
========================= */

let animationToken = 0;
let lastRandomAnimation = 0;
let currentReveal = "";
let fadeTimer1 = null;
let fadeTimer2 = null;
let fadeTimer3 = null;
let fadeTimer4 = null;

window.firebaseConnected = false;
window.serverTimeOffset = 0;
window.serverTimeReady = false;

function syncedNow() {

  const serverNow =
    Date.now() + window.serverTimeOffset;

  const MYANMAR_OFFSET_MINUTES =
    6 * 60 + 30;

  const deviceOffsetMinutes =
    new Date(serverNow).getTimezoneOffset();

  return (
    serverNow +
    (MYANMAR_OFFSET_MINUTES + deviceOffsetMinutes) *
    60 *
    1000
  );
}

/* =========================
   SHARED 7 SECOND SLOT
   MAIN + UPDATE TIME
   အချိန်ကွက်တိတူ
========================= */

function get7SecondSlot() {
  return Math.floor(syncedNow() / 7000);
}
function is2DClosedDay() {
  const now = new Date(syncedNow());

  // Wednesday = 3
  return now.getDay() === 3;
}
function isHoliday2D() {

  const now = new Date(syncedNow());

  const date =
    String(now.getDate()).padStart(2, "0") +
    "/" +
    String(now.getMonth() + 1).padStart(2, "0") +
    "/" +
    now.getFullYear();

  const holidayDates = [
    "13/04/2026",
    "14/04/2026",
    "15/04/2026",
    "26/10/2026",
    "25/12/2026",
    "01/01/2027"
  ];

  return holidayDates.includes(date);
}
window.internetReady = false;
let internetCheckRunning = false;

async function checkRealInternet() {

  if (internetCheckRunning) return;

  internetCheckRunning = true;

  try {

    const controller = new AbortController();

    const timeout = setTimeout(() => {
      controller.abort();
    }, 2000);

    const response = await fetch(
      "https://millionaire-dubai-default-rtdb.firebaseio.com/.json?check=" + Date.now(),
      {
        method: "GET",
        cache: "no-store",
        signal: controller.signal
      }
    );

    clearTimeout(timeout);

    if (!response.ok) {
      throw new Error("Firebase offline");
    }

    window.internetReady = true;

    checkResult();

  } catch (error) {

    console.warn(
      "Internet check failed:",
      error
    );

    window.internetReady = false;

    animationToken++;

    stopResultJump();

    clearTimeout(fadeTimer1);
    clearTimeout(fadeTimer2);
    clearTimeout(fadeTimer3);
    clearTimeout(fadeTimer4);

    numberElement.classList.remove(
      "fade-out",
      "random-fade-out",
      "random-fade-in",
      "pre-result-loop"
    );

    numberElement.style.opacity = "1";

    numberElement.style.transform =
      "translateY(0)";

    currentReveal = "OFFLINE";

    numberElement.textContent = "--";

  } finally {

    internetCheckRunning = false;

  }
}

checkRealInternet();

setInterval(
  checkRealInternet,
  10000
);
window.addEventListener("offline", () => {

  window.internetReady = false;

  animationToken++;

  stopResultJump();

  numberElement.classList.remove("fade-out");

  numberElement.style.transform =
    "translateY(0)";

  currentReveal = "OFFLINE";

  numberElement.textContent = "--";

});


window.addEventListener("online", () => {

  checkRealInternet();

});

/* =========================
   GET CURRENT DRAW
========================= */

let randomSlotValue = "--";
let randomSlotKey = "";

function updateSetValue(randomValue) {

  const setElement =
    document.getElementById("setValue");

  const valueElement =
    document.getElementById("valueValue");

  if (!setElement || !valueElement) return;

  if (
    !randomValue ||
    randomValue === "--" ||
    randomValue === "?"
  ) {
    setElement.textContent = "--";
    valueElement.textContent = "--";
    return;
  }

  /*
    Firebase Main Number
    ဥပမာ 36
  */
  const n =
    String(randomValue).padStart(2, "0");

  /*
    Main Number ရဲ့ digit နှစ်လုံး
     
    36
    ├─ SET   decimal နောက်ဆုံး digit = 3
    └─ VALUE decimal နောက်ဆုံး digit = 6
  */
  const mainFirstDigit =
    n.charAt(0);

  const mainSecondDigit =
    n.charAt(1);


  /*
    =========================
    SAME SLOT HASH
    =========================

    ဖုန်းတိုင်းမှာ
    randomSlotKey + Main Number
    တူတဲ့အတွက်
    hash လည်းတူမယ်။
  */

  let hash = 0;

  const seed =
    randomSlotKey + ":" + n;

  for (let i = 0; i < seed.length; i++) {

    hash =
      ((hash << 5) - hash) +
      seed.charCodeAt(i);

    hash |= 0;
  }

  hash =
    Math.abs(hash);


  /*
    =========================
    SET WHOLE
    18,200 ~ 18,900
    =========================
  */

  const setWhole =
    18200 + (hash % 701);


  /*
    =========================
    VALUE WHOLE
    16,200 ~ 16,900
    =========================
  */

  const valueWhole =
    16200 + ((hash * 37) % 701);


  /*
    =========================
    DECIMAL
    =========================

    Decimal ရဲ့ နောက်ဆုံး digit ကို
    Main Number နဲ့ တိတိကျကျ ချိတ်မယ်။

    Main = 36 ဆိုရင်

    SET   = xxxx.x3
    VALUE = xxxx.x6

    Main = 34 ဆိုရင်

    SET   = xxxx.x3
    VALUE = xxxx.x4
  */

  const setFirstDecimal =
    Math.floor(hash / 7) % 10;

  const valueFirstDecimal =
    Math.floor(hash / 37) % 10;

  const setDecimal =
    String(setFirstDecimal) +
    mainFirstDigit;

  const valueDecimal =
    String(valueFirstDecimal) +
    mainSecondDigit;


  /*
    =========================
    DISPLAY
    =========================
  */

  setElement.textContent =
    setWhole.toLocaleString("en-US") +
    "." +
    setDecimal;

  valueElement.textContent =
    valueWhole.toLocaleString("en-US") +
    "." +
    valueDecimal;
}

function getCurrentDraw() {
  // ===== TEST MODE =====
 if (TEST_MODE) {
    const testNow =
      Date.now();

    const testDrawTime =
  testDrawStartTime +
  (TEST_DRAW_AFTER_SECONDS * 1000);

    const testRevealTime =
      testDrawTime - 15000;

    if (testNow >= testRevealTime &&
        testNow < testDrawTime) {
      return {
        draw: {
          name: "1:00 PM",
          seconds: 0
        },
        state: "revealing"
      };
    }

    if (testNow >= testDrawTime &&
        testNow < testDrawTime + 60000) {
      return {
        draw: {
          name: "1:00 PM",
          seconds: 0
        },
        state: "fixed"
      };
    }

    return null;
  }
  const now =
    new Date(syncedNow());

  const currentSeconds =
    now.getHours() * 3600 +
    now.getMinutes() * 60 +
    now.getSeconds();

  for (const draw of drawTimes) {

    const revealTime =
      draw.seconds - 15;

    if (
      currentSeconds >= revealTime &&
      currentSeconds < draw.seconds
    ) {

      return {
        draw: draw,
        state: "revealing"
      };

    }

    if (
      currentSeconds >= draw.seconds &&
      currentSeconds < draw.seconds + 300
    ) {

      return {
        draw: draw,
        state: "fixed"
      };

    }

  }

  return null;
}
/* =========================
   SUNDAY DUBAI 3D
========================= */

function updateSundayDubai3D() {

  const box =
    document.getElementById("sundayDubai3D");

  const resultBox =
    document.getElementById("sundayDubaiResult");

  if (!box || !resultBox) return;

  const now =
    new Date(syncedNow());

  /* Sunday = 0 */
  const isSunday = now.getDay() === 0;

  if (!isSunday) {

    box.style.display = "none";

    return;
  }

  box.style.display = "block";

  const currentSeconds =
    now.getHours() * 3600 +
    now.getMinutes() * 60 +
    now.getSeconds();

  const fivePM =
    17 * 3600;

  const sevenPM =
    19 * 3600;

  const ninePM =
    21 * 3600;


  /* =========================
     5 PM
     နောက်ဆုံးဂဏန်း → ထိပ်
  ========================= */

  let top = "*";

  if (currentSeconds >= fivePM) {

    const result5 =
      getDrawResult("5:00 PM");

    if (
      result5 &&
      result5 !== "--" &&
      result5.length >= 2
    ) {
      top =
        result5.charAt(
          result5.length - 1
        );
    }
  }


  /* =========================
     7 PM
     နောက်ဆုံးဂဏန်း → အလည်
  ========================= */

  let middle = "*";

  if (currentSeconds >= sevenPM) {

    const result7 =
      getDrawResult("7:00 PM");

    if (
      result7 &&
      result7 !== "--" &&
      result7.length >= 2
    ) {
      middle =
        result7.charAt(
          result7.length - 1
        );
    }
  }


  /* =========================
     9 PM
     နောက်ဆုံးဂဏန်း → အပိတ်
  ========================= */

  let bottom = "*";

  if (currentSeconds >= ninePM) {

    const result9 =
      getDrawResult("9:00 PM");

    if (
      result9 &&
      result9 !== "--" &&
      result9.length >= 2
    ) {
      bottom =
        result9.charAt(
          result9.length - 1
        );
    }
  }


  resultBox.textContent =
    top + middle + bottom;
}

/* =========================
   UPDATE TIME CARDS
========================= */

function updateTimeCards() {

  const now = new Date(syncedNow());

  const currentSeconds =
    now.getHours() * 3600 +
    now.getMinutes() * 60 +
    now.getSeconds();

  const cards =
    document.querySelectorAll(
      ".container .time-card"
    );

  drawTimes.forEach((draw, index) => {

    const card = cards[index];

    if (!card) return;

    const resultBox =
      card.querySelector(".result");

    if (!resultBox) return;

    if (currentSeconds >= draw.seconds) {

      resultBox.textContent =
        getDrawResult(draw.name);

    } else {

      resultBox.textContent = "?";

    }

  });
}
/* =========================
   RESULT JUMP
========================= */



function startResultJump(draw) {

  stopResultJump();

  const result =
    getDrawResult(draw.name);

  animationToken++;

  numberElement.textContent =
    result;

  numberElement.classList.remove(
    "random-fade-out",
    "random-fade-in",
    "pre-result-loop"
  );

  // Animation ကို browser က အသစ်ပြန်စအောင်
  void numberElement.offsetWidth;

  // :45 ကနေ Draw Time အထိ အဆက်မပြတ် Loop
  numberElement.classList.add(
    "pre-result-loop"
  );
}

/* =========================
   STOP JUMP
========================= */

function stopResultJump() {

  numberElement.classList.remove(
    "fade-out",
    "random-fade-out",
    "random-fade-in",
    "pre-result-loop"
  );

  numberElement.style.transform =
    "translateY(0)";
}


/* =========================
   SHOW PRE RESULT
========================= */

function showPreResult(draw) {

  const result =
    getDrawResult(draw.name);

  numberElement.textContent =
    result;

  startResultJump(draw);
}


/* =========================
   FINAL RESULT
========================= */

function showFinalResult(draw) {

  stopResultJump();

  numberElement.style.transform =
    "translateY(0)";

  numberElement.textContent = getDrawResult(draw.name);

  updateTimeCards();
}


/* =========================
   RANDOM ANIMATION
========================= */

function animateRandomNumber(value) {
  clearTimeout(fadeTimer1);
  clearTimeout(fadeTimer2);
  clearTimeout(fadeTimer3);
  clearTimeout(fadeTimer4);

  animationToken++;
  const token = animationToken;

  numberElement.classList.remove(
    "random-fade-out",
    "random-fade-in",
    "pre-result-loop"
  );

  // အသစ်ပြောင်းတဲ့ဂဏန်းကို အရင်ဆုံးမြင်ရအောင်
  numberElement.style.opacity = "1";
  numberElement.style.transform = "translateY(0)";
  numberElement.textContent = value;

  // Fade out #1
  fadeTimer1 = setTimeout(() => {
    if (token !== animationToken) return;

    numberElement.classList.remove("random-fade-in");
    numberElement.classList.add("random-fade-out");
  }, 2000);

  // ပြန်ပေါ်
  fadeTimer2 = setTimeout(() => {
    if (token !== animationToken) return;

    numberElement.classList.remove("random-fade-out");
    numberElement.classList.add("random-fade-in");

    // animation ပြီးရင် opacity ကို အတိအကျ 1 ထား
    setTimeout(() => {
      if (token === animationToken) {
        numberElement.style.opacity = "1";
      }
    }, 550);

  }, 2500);

  // Fade out #2
  fadeTimer3 = setTimeout(() => {
    if (token !== animationToken) return;

    numberElement.classList.remove("random-fade-in");
    numberElement.classList.add("random-fade-out");
  }, 4000);

  // နောက်ဆုံး ပြန်ပေါ်ပြီး မပျောက်တော့
  fadeTimer4 = setTimeout(() => {
    if (token !== animationToken) return;

    numberElement.classList.remove("random-fade-out");
    numberElement.classList.add("random-fade-in");

    setTimeout(() => {
      if (token === animationToken) {
        numberElement.classList.remove(
          "random-fade-out",
          "random-fade-in"
        );

        numberElement.style.opacity = "1";
        numberElement.style.transform = "translateY(0)";
      }
    }, 550);

  }, 4500);
}
/* =========================
   MAIN CHECK
========================= */

/* =========================
   MAIN CHECK
========================= */

function checkResult() {

  updateSundayDubai3D();
  updateTimeCards();


  /* =========================
     CLOSED DAY
  ========================= */

  if (
    is2DClosedDay() ||
    isHoliday2D()
  ) {

    animationToken++;

    stopResultJump();

    clearTimeout(fadeTimer1);
    clearTimeout(fadeTimer2);
    clearTimeout(fadeTimer3);
    clearTimeout(fadeTimer4);

    numberElement.classList.remove(
      "fade-out",
      "random-fade-out",
      "random-fade-in",
      "pre-result-loop"
    );

    numberElement.style.opacity = "1";
    numberElement.style.transform = "translateY(0)";

    numberElement.textContent = "--";

    currentReveal = "2D_CLOSED";

    return;
  }


  /* =========================
     INTERNET / FIREBASE
  ========================= */

  if (
    window.internetReady !== true ||
    window.firebaseConnected !== true
  ) {

    numberElement.style.opacity = "1";
    numberElement.style.transform = "translateY(0)";

    numberElement.textContent = "--";

    currentReveal = "OFFLINE";

    return;
  }


  /* =========================
     CURRENT TIME
  ========================= */

  const now =
    new Date(syncedNow());

  const hours =
    now.getHours();

  const minutes =
    now.getMinutes();

  const seconds =
    now.getSeconds();

  const currentSeconds =
    hours * 3600 +
    minutes * 60 +
    seconds;


  /* =========================
     BEFORE 7:00 AM
  ========================= */

  if (
    currentSeconds < 7 * 3600
  ) {

    stopResultJump();

    numberElement.style.opacity = "1";
    numberElement.style.transform = "translateY(0)";

    numberElement.textContent = "--";

    currentReveal = "WAITING";

    return;
  }


  /* =========================
     AFTER 9:00 PM
  ========================= */

  if (
    currentSeconds >= 21 * 3600
  ) {

    const result =
      getDrawResult("9:00 PM");

    animationToken++;

    stopResultJump();

    clearTimeout(fadeTimer1);
    clearTimeout(fadeTimer2);
    clearTimeout(fadeTimer3);
    clearTimeout(fadeTimer4);

    numberElement.style.opacity = "1";
    numberElement.style.transform = "translateY(0)";

    numberElement.textContent =
      result || "--";

    currentReveal =
      "9:00 PM:FINAL";

    return;
  }


  /* =========================
     FIND CURRENT DRAW
  ========================= */

  let activeDraw = null;

  for (
    const draw of drawTimes
  ) {

    /*
      00 sec ကနေ
      5 minutes အထိ
      Final Result
    */

    if (
      currentSeconds >= draw.seconds &&
      currentSeconds < draw.seconds + 300
    ) {

      activeDraw = draw;

      break;
    }
  }


  /* =========================
     FIND NEXT DRAW
  ========================= */

  let nextDraw = null;

  for (
    const draw of drawTimes
  ) {

    if (
      currentSeconds < draw.seconds
    ) {

      nextDraw = draw;

      break;
    }
  }


  /* =========================
     PRE-RESULT
     42 / 49 / 56
  ========================= */

  if (
    nextDraw &&
    currentSeconds >= nextDraw.seconds - 60 &&
    currentSeconds < nextDraw.seconds
  ) {

    const secondsBeforeDraw =
      currentSeconds -
      (nextDraw.seconds - 60);


    /*
      42 / 49 / 56
      Pre-Result
    */

    if (
      secondsBeforeDraw >= 42
    ) {

      const firebaseResult =
        getDrawResult(nextDraw.name);


      if (
        firebaseResult &&
        firebaseResult !== "--"
      ) {

        const eventKey =
          `${nextDraw.name}:PRE`;


        /*
          42 sec မှာ တစ်ကြိမ်ပဲ
          Pre-Result စမယ်

          49 / 56 မှာ
          ဂဏန်း မပြောင်းပါ
        */

        if (
          currentReveal !== eventKey
        ) {

          currentReveal =
            eventKey;

          animationToken++;

          clearTimeout(fadeTimer1);
          clearTimeout(fadeTimer2);
          clearTimeout(fadeTimer3);
          clearTimeout(fadeTimer4);

          stopResultJump();

          numberElement.textContent =
            firebaseResult;

updateSetValue(firebaseResult);

          numberElement.style.opacity =
            "1";

          numberElement.style.transform =
            "translateY(0)";

          void numberElement.offsetWidth;

          numberElement.classList.add(
            "pre-result-loop"
          );
        }
      }

      return;
    }
  }


  /* =========================
     FINAL RESULT
     00 SEC → 5 MINUTES FIXED
  ========================= */

  if (
    activeDraw &&
    currentSeconds >= activeDraw.seconds &&
    currentSeconds < activeDraw.seconds + 300
  ) {

    const eventKey =
      `${activeDraw.name}:FINAL`;


    /*
      5 မိနစ်အတွင်း
      Final Result မပြောင်း
    */

    if (
      currentReveal !== eventKey
    ) {

      currentReveal =
        eventKey;

      animationToken++;

      clearTimeout(fadeTimer1);
      clearTimeout(fadeTimer2);
      clearTimeout(fadeTimer3);
      clearTimeout(fadeTimer4);

      stopResultJump();


      const finalResult =
        getDrawResult(
          activeDraw.name
        );


      numberElement.textContent =
  finalResult || "--";

updateSetValue(finalResult || "--");

      numberElement.style.opacity =
        "1";

      numberElement.style.transform =
        "translateY(0)";
    }

    return;
  }


  /* =========================
     RANDOM
     00 / 07 / 14 / 21 / 28 / 35
  ========================= */

  /* =========================
   FIREBASE SHARED RANDOM
   7 SECOND SLOT
========================= */

/* =========================
   FIREBASE SHARED RANDOM
   SERVER TIME - 7 SECOND SLOT
========================= */

if (!window.serverTimeReady) {

  numberElement.textContent = "--";

  return;
}


/*
  Firebase Server Time
*/
const serverMs =
  Date.now() +
  Number(window.serverTimeOffset || 0);


/*
  Myanmar Time = UTC + 6:30
*/
const myanmarMs =
  serverMs +
  (6 * 60 + 30) * 60 * 1000;

const serverDate =
  new Date(myanmarMs);


/*
  Myanmar Date / Time
*/
const serverYear =
  serverDate.getUTCFullYear();

const serverMonth =
  serverDate.getUTCMonth() + 1;

const serverDay =
  serverDate.getUTCDate();

const serverHours =
  serverDate.getUTCHours();

const serverMinutes =
  serverDate.getUTCMinutes();

const serverSeconds =
  serverDate.getUTCSeconds();


const pad =
  n => String(n).padStart(2, "0");


/*
  7 Second Slot

  00 - 06 = 0
  07 - 13 = 1
  14 - 20 = 2
  21 - 27 = 3
  28 - 34 = 4
  35 - 41 = 5
  42 - 48 = 6
  49 - 55 = 7
  56 - 59 = 8
*/
const slot =
  Math.floor(serverSeconds / 7);


/*
  Local browser အချိန်မသုံးတော့ဘူး
  Firebase Server Time ကိုပဲသုံးမယ်
*/
const eventKey =
  `${serverYear}-${pad(serverMonth)}-${pad(serverDay)}_${pad(serverHours)}_${pad(serverMinutes)}_R${slot}`;


if (
  randomSlotKey !== eventKey
) {

  randomSlotKey =
    eventKey;


  /*
    Firebase path
    ဖုန်းအားလုံး တစ်နေရာတည်း
  */
  const firebaseSlotKey =
    `${serverYear}-${pad(serverMonth)}-${pad(serverDay)}/${pad(serverHours)}/${pad(serverMinutes)}/${slot}`;


  window.getFirebaseRandomNumber(
    firebaseSlotKey
  ).then(value => {


    /*
      Slot ပြောင်းသွားရင်
      အဟောင်း result မပြ
    */
    if (
      randomSlotKey !== eventKey
    ) {
      return;
    }


    if (
      value === "--"
    ) {

      numberElement.textContent =
        "--";

      return;
    }


    randomSlotValue =
  value;

updateSetValue(
  randomSlotValue
);

animateRandomNumber(
  randomSlotValue
);

  });

}

return;
}

const twoDTimes = [
  "11:00 AM",
  "1:00 PM",
  "3:00 PM",
  "5:00 PM",
  "7:00 PM",
  "9:00 PM"
];


function load2DResults() {

  const list =
    document.getElementById("twoDList");

  if (!list) return;

  /* =========================
     OLD STATIC HISTORY
  ========================= */

  const allHistory = {};

  twoDData.forEach(item => {

    const dayData = {};

    twoDTimes.forEach((time, index) => {

      const historyKey =
        time.replace(" ", "");

      dayData[historyKey] =
        item.results[index] || "";

    });

    allHistory[item.date] =
      dayData;

  });


  /* =========================
     FIREBASE HISTORY
  ========================= */

  const firebaseHistory =
    window.firebaseHistory || {};

  Object.keys(firebaseHistory).forEach(dateKey => {

    if (!allHistory[dateKey]) {
      allHistory[dateKey] = {};
    }

    Object.assign(
      allHistory[dateKey],
      firebaseHistory[dateKey]
    );

  });


  /* =========================
     CURRENT DATE / TIME
  ========================= */

  const now =
    new Date(syncedNow());

  const pad = n =>
    String(n).padStart(2, "0");

  const today =
    `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;

  const currentSeconds =
    now.getHours() * 3600 +
    now.getMinutes() * 60 +
    now.getSeconds();


  /* =========================
     DISPLAY
  ========================= */

  list.innerHTML = "";

  const dates =
    Object.keys(allHistory).sort(
      (a, b) => b.localeCompare(a)
    );


  dates.forEach(dateKey => {

    const dayData =
      allHistory[dateKey];

    if (!dayData) return;


    /* =========================
       TODAY TIME FILTER
    ========================= */

    const isToday =
      dateKey === today;


    const date =
      document.createElement("div");

    date.className =
      "twoD-date";

    date.textContent =
      dateKey;

    list.appendChild(date);


    const grid =
      document.createElement("div");

    grid.className =
      "time-grid";


    twoDTimes.forEach((time, index) => {

      const historyKey =
        time.replace(" ", "");

      /* =========================
         DRAW TIME
      ========================= */

      const drawSeconds = [
        11 * 3600, // 11:00 AM
        13 * 3600, // 1:00 PM
        15 * 3600, // 3:00 PM
        17 * 3600, // 5:00 PM
        19 * 3600, // 7:00 PM
        21 * 3600  // 9:00 PM
      ][index];


      let result =
        dayData[historyKey] || "";


      /* =========================
         TODAY ONLY
         Future result မပြ
      ========================= */

      if (
        isToday &&
        currentSeconds < drawSeconds
      ) {

        result = "";

      }


      const card =
        document.createElement("div");

      card.className =
        "time-card";


      card.innerHTML = `
        <strong>${time}</strong>
        <div class="result">${result}</div>
      `;


      grid.appendChild(card);

    });


    list.appendChild(grid);

  });

}

function getCurrentDateTime() {

  const now = new Date(syncedNow());

  const pad = n =>
    String(n).padStart(2, "0");

  const year =
    now.getFullYear();

  const month =
    pad(now.getMonth() + 1);

  const day =
    pad(now.getDate());

  let hours =
    now.getHours();

  const minutes =
    pad(now.getMinutes());

  const seconds =
    pad(now.getSeconds());

  const ampm =
    hours >= 12 ? "PM" : "AM";

  hours =
    hours % 12 || 12;

  return `${year}-${month}-${day} ${pad(hours)}:${minutes}:${seconds} ${ampm}`;
}

function get7SecondUpdateTime() {

  /*
    MAIN NUMBER နဲ့
    အတိအကျ SAME SERVER TIME သုံးမယ်
  */

  const serverMs =
    Date.now() +
    Number(window.serverTimeOffset || 0);

  /*
    Myanmar Time = UTC + 6:30
  */
  const myanmarMs =
    serverMs +
    (6 * 60 + 30) * 60 * 1000;

  const now =
    new Date(myanmarMs);


  const pad =
    n => String(n).padStart(2, "0");


  const year =
    now.getUTCFullYear();

  const month =
    pad(now.getUTCMonth() + 1);

  const day =
    pad(now.getUTCDate());


  let hours =
    now.getUTCHours();

  const minutes =
    pad(now.getUTCMinutes());


  /*
    MAIN NUMBER နဲ့
    EXACT SAME 7 SECOND SLOT
  */

  const slot =
    Math.floor(
      now.getUTCSeconds() / 7
    );


  const seconds =
    pad(slot * 7);


  const ampm =
    hours >= 12
      ? "PM"
      : "AM";


  hours =
    hours % 12 || 12;


  return `${year}-${month}-${day} ${pad(hours)}:${minutes}:${seconds} ${ampm}`;
}

let historySaveLock = {};

window.save2DResultToHistory = async function(drawName, result) {

  if (
    !window.firebaseConnected ||
    !window.internetReady
  ) {
    return;
  }

  if (!result || result === "--") {
    return;
  }

  const now =
    new Date(syncedNow());

  const pad =
    n => String(n).padStart(2, "0");

  const today =
    `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;

  const historyKey =
    drawName.replace(" ", "");

  const lockKey =
    today + "_" + historyKey;

  /* တစ်ကြိမ်ပဲလုပ် */
  if (historySaveLock[lockKey]) {
    return;
  }

  historySaveLock[lockKey] = true;

  try {

    const historyRef =
      ref(
        db,
        `history/2D/${today}/${historyKey}`
      );

    /* History ထဲမှာ ရှိပြီးသားလား စစ် */
    const snapshot =
      await get(historyRef);

    /* ရှိပြီးသားဆို ထပ်မရေး */
    if (snapshot.exists()) {
      return;
    }

    /* Results ထဲက Result ကို History ထဲသိမ်း */
    await set(
      historyRef,
      String(result).padStart(2, "0")
    );

  } catch (error) {

    console.error(
      "History save error:",
      error
    );

    delete historySaveLock[lockKey];

  }

};

async function saveSundayDubai3DHistory() {

  if (
    !window.firebaseConnected ||
    !window.internetReady
  ) {
    return;
  }

  const now = new Date(syncedNow());

  // Sunday only
  if (now.getDay() !== 0) {
    return;
  }

  const currentSeconds =
    now.getHours() * 3600 +
    now.getMinutes() * 60 +
    now.getSeconds();

  // 9:00 PM မရောက်သေးရင် မသိမ်း
  if (currentSeconds < 21 * 3600) {
    return;
  }

  const result5 = getDrawResult("5:00 PM");
  const result7 = getDrawResult("7:00 PM");
  const result9 = getDrawResult("9:00 PM");

  if (
    !result5 || result5 === "--" ||
    !result7 || result7 === "--" ||
    !result9 || result9 === "--"
  ) {
    return;
  }

  const dubai3D =
    result5.charAt(result5.length - 1) +
    result7.charAt(result7.length - 1) +
    result9.charAt(result9.length - 1);

  const pad = n =>
    String(n).padStart(2, "0");

  const today =
    `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;

  const history3DRef =
  ref(db, `history/Dubai3D/${today}`);
  try {

    const snapshot =
      await get(history3DRef);

    if (snapshot.exists()) {
      return;
    }

    await set(
      history3DRef,
      dubai3D
    );

  } catch (error) {

    console.error(
      "Dubai 3D history save error:",
      error
    );

  }
}

/* =========================

   STABLE - NO FLICKERING FIX
========================= */

const dubai3DHistoryRef = ref(db, "history/Dubai3D");
let lastDubai3DHistoryData = "";

onValue(dubai3DHistoryRef, (snapshot) => {
  const data = snapshot.val() || {};
  const dataString = JSON.stringify(data);

  // Data လုံးဝ မပြောင်းလဲသေးရင် DOM ကို လုံးဝ မတို့ပါနဲ့ (တုန်ခြင်းကို ကာကွယ်ရန်)
  if (dataString === lastDubai3DHistoryData) {
    return;
  }
  lastDubai3DHistoryData = dataString;

  displayDubai3DHistory(data);
});

function displayDubai3DHistory(data) {

  const container =
    document.getElementById(
      "firebaseDubai3DHistory"
    );

  if (!container) return;


  /* =========================
     FIREBASE DATA
  ========================= */

  const firebaseData = data || {};


  /* =========================
     MERGE STATIC + FIREBASE
     Firebase ကို ဦးစားပေး
  ========================= */

  const allHistory = {};


  // HTML ထဲက အဟောင်း data
  staticDubai3DHistory.forEach(item => {

    allHistory[item.date] =
      item.result;

  });


  // Firebase data
  Object.entries(firebaseData).forEach(
    ([dateKey, result]) => {

      allHistory[dateKey] =
        result;

    }
  );


  /* =========================
     NEWEST FIRST
  ========================= */

  const dates =
    Object.keys(allHistory).sort(
      (a, b) =>
        b.localeCompare(a)
    );


  /* =========================
     DISPLAY
  ========================= */

  container.innerHTML = "";


  dates.forEach(dateKey => {

    const result =
      String(allHistory[dateKey])
        .padStart(3, "0");


    const card =
      document.createElement("div");

    card.className =
      "history-card";

    card.dataset.historyDate =
      dateKey;


    card.innerHTML = `
      <div class="history-top">
        <span>Date</span>
        <span>3D</span>
      </div>

      <div class="history-bottom">
        <span>${dateKey}</span>
        <strong>${result}</strong>
      </div>
    `;


    container.appendChild(card);

  });

}
